spring.application.name=frelog-test

# Separate IP and Port variables for testing consistency
app.db.host=localhost
app.db.port=1433
app.db.name=agora_db
app.db.username=sa
app.db.password=

# Use H2 database for isolated automated test execution
spring.datasource.url=jdbc:h2:mem:agora_db;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT settings
jwt.secret=c29tZS12ZXJ5LXNlY3VyZS1hbmQtbG9uZy1zZWNyZXQta2V5LWZvci1hZ29yYS1qd3QtYXV0aC0yMDI2
jwt.expiration-ms=3600000
