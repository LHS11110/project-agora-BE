spring.application.name=frelog
# Load the local, git-ignored .env when running the JAR from the project root.
# Deployed processes can continue to supply secrets through environment variables.
spring.config.import=optional:file:./.env[.properties],optional:configtree:/run/secrets/

# =======================================================
# Database Connection Configuration (Address / Host & Port Managed)
# =======================================================
app.db.host=${DB_HOST:127.0.0.1}
app.db.port=${DB_PORT:1433}
app.db.address=${DB_ADDRESS:${app.db.host}:${app.db.port}}
app.db.name=${DB_NAME:agora_db}
app.db.username=${DB_USER:agora_user}
app.db.password=${DB_PASSWORD}
# TLS is required by default.  Set DB_TRUST_SERVER_CERTIFICATE=true only for a
# deliberately isolated development database with no verifiable certificate.
app.db.encrypt=${DB_ENCRYPT:true}
app.db.trust-server-certificate=${DB_TRUST_SERVER_CERTIFICATE:false}
app.db.multi-subnet-failover=${DB_MULTI_SUBNET_FAILOVER:true}

# Spring DataSource Settings (Derived from app.db.* properties)
spring.datasource.url=jdbc:sqlserver://${app.db.host}:${app.db.port};databaseName=${app.db.name};encrypt=${app.db.encrypt};trustServerCertificate=${app.db.trust-server-certificate};multiSubnetFailover=${app.db.multi-subnet-failover};applicationIntent=ReadWrite;sendStringParametersAsUnicode=true;useUnicode=true;characterEncoding=UTF-8
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Auto-fallback to H2 in-memory DB if MSSQL port is not listening
app.db.auto-fallback=false

# =======================================================
# JWT Security Configuration
# =======================================================
jwt.secret=${JWT_SECRET}
# 86400000 ms = 24 hours
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =======================================================
# Elasticsearch Connection Configuration
# =======================================================
app.elasticsearch.host=${ES_HOST:127.0.0.1}
app.elasticsearch.port=${ES_PORT:9200}
app.elasticsearch.scheme=${ES_SCHEME:http}
app.elasticsearch.ca-certificate=${ES_CA_CERT:}
app.elasticsearch.index=${ES_INDEX:canvas}
app.elasticsearch.username=${ES_USER_NAME:agora_user}
app.elasticsearch.password=${ES_USER_PASSWORD}
app.elasticsearch.log-index=${ES_LOG_INDEX:agora-logs}
app.elasticsearch.log-username=${ES_LOG_USER_NAME:agora_log_writer}
app.elasticsearch.log-password=${ES_LOG_USER_PASSWORD:}
app.elasticsearch.auto-create=true
app.elasticsearch.fail-on-error=false
app.elasticsearch.logs.batch-size=${ES_LOG_BATCH_SIZE:100}
app.elasticsearch.logs.flush-interval-ms=${ES_LOG_FLUSH_INTERVAL_MS:1000}
app.ha.failover-monitor-interval-ms=${HA_FAILOVER_MONITOR_INTERVAL_MS:10000}

# =======================================================
# UTF-8 HTTP Encoding Configuration
# =======================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.address=127.0.0.1
server.forward-headers-strategy=native
spring.task.scheduling.pool.size=2

# =======================================================
# JSP View Resolver Configuration
# =======================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# =======================================================
# Initial Admin Setup Configuration
# =======================================================
app.admin.email=admin@agora.com
app.admin.password=${ADMIN_PASSWORD}
app.admin.nickname=아고라관리자


# =======================================================
# C++ Server Configuration
# =======================================================
app.cpp.ws-port-offset=${CPP_WS_PORT_OFFSET:2}

app.redis.username=${REDIS_USER}
app.redis.password=${REDIS_USER_PASSWORD}
app.redis.sentinels=${REDIS_SENTINELS:}
app.redis.sentinel-master-name=${REDIS_SENTINEL_MASTER_NAME:agora-master}

# Comma-separated browser origins allowed to call this API cross-origin. Empty
# disables cross-origin browser access; same-origin requests remain available.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
