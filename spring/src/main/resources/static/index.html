<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora Premium Testbed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --glass-bg: rgba(17, 24, 39, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --font-family: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--primary-glow); top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: var(--accent-glow); bottom: -150px; right: -100px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        /* Views */
        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 30px;
            height: 100%;
            overflow-y: auto;
        }
        .view.active {
            display: flex;
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* UI Elements */
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-family: var(--font-family);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-outline {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-main);
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        /* Auth View */
        .auth-container {
            max-width: 400px;
            margin: auto;
            width: 100%;
            text-align: center;
        }
        .auth-container h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .auth-container p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .quick-logins {
            margin-top: 24px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Dashboard Layout */
        .dashboard-layout {
            display: flex;
            gap: 24px;
            flex: 1;
            height: calc(100% - 70px);
            padding: 24px;
        }
        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--glass-border);
            padding-right: 24px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        /* Canvas List */
        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
        }
        .canvas-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .canvas-card:hover, .canvas-card.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateX(4px);
        }
        .canvas-name { font-weight: 600; font-size: 1rem; }
        .canvas-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .status-dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }

        /* Broadcast Chat UI */
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            word-break: break-all;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-system {
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            align-self: center;
            font-size: 0.8rem;
            border-radius: 8px;
            padding: 6px 12px;
        }
        .msg-me {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .msg-other {
            background: rgba(255,255,255,0.08);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-sender {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">
        <header>
            <h1>✨ Agora Realtime</h1>
            <div class="user-status" id="userStatus">
                <span id="userNameText" style="color: var(--text-muted);">로그인 대기 중</span>
                <button id="logoutBtn" class="btn-outline" style="padding: 6px 12px; font-size: 0.8rem; display: none;" onclick="logout()">로그아웃</button>
            </div>
        </header>

        <!-- Auth View -->
        <div id="authView" class="view active">
            <div class="auth-container">
                <h2>Welcome Back</h2>
                <p>프리미엄 퀄리티의 실시간 브로드캐스트 테스트베드</p>
                
                <div class="auth-form">
                    <input type="email" id="email" placeholder="이메일 (admin@agora.com)" value="admin@agora.com">
                    <input type="password" id="password" placeholder="비밀번호 (admin123)" value="admin123">
                    <button class="btn-primary" onclick="login()" id="loginBtn">
                        <span id="loginText">로그인 및 시스템 접속</span>
                        <div class="loader" id="loginLoader"></div>
                    </button>
                </div>

                <div class="quick-logins">
                    <button class="btn-outline" style="padding: 8px 14px; font-size:0.8rem;" onclick="setQuickLogin('admin@agora.com', 'admin123')">👑 Admin</button>
                    <button class="btn-outline" style="padding: 8px 14px; font-size:0.8rem;" onclick="setQuickLogin('user@agora.com', 'password123')">👤 User</button>
                </div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboardView" class="dashboard-layout" style="display: none;">
            
            <div class="sidebar">
                <div>
                    <h3 class="section-title">새 캔버스 생성</h3>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="newCanvasName" placeholder="캔버스 이름" style="padding: 10px 14px; font-size: 0.85rem;">
                        <button class="btn-primary" style="padding: 10px 14px;" onclick="createCanvas()">생성</button>
                    </div>
                </div>

                <div style="margin-top: 10px; display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h3 class="section-title" style="margin: 0;">내 캔버스 목록</h3>
                        <button class="btn-outline" style="padding: 4px 8px; font-size: 0.7rem;" onclick="loadCanvases()">🔄</button>
                    </div>
                    <div id="canvasList" style="overflow-y: auto; flex: 1; padding-right: 4px;">
                        <!-- Canvas cards injected here -->
                    </div>
                </div>
            </div>

            <div class="main-content" id="broadcastArea" style="opacity: 0.3; pointer-events: none; transition: all 0.3s;">
                <div class="chat-header">
                    <div>
                        <h2 style="font-size: 1.1rem; font-weight: 600;" id="activeCanvasTitle">캔버스를 선택해주세요</h2>
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;" id="activeCanvasMeta">선택 시 자동으로 Access API 및 C++ WebSocket 연결이 수행됩니다.</p>
                    </div>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <span id="connectionBadge" style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted);">
                            <div class="status-dot" id="connectionDot"></div> <span id="connectionText">미연결</span>
                        </span>
                        <button id="connectBtn" class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="connectActiveCanvas()">접속하기</button>
                    </div>
                </div>

                <div class="chat-messages" id="chatContainer">
                    <div class="msg-system">왼쪽 목록에서 캔버스를 선택한 후 접속하세요.</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="메시지를 입력하세요... (Enter 키로 전송)" onkeypress="handleChatKey(event)" disabled>
                    <button class="btn-primary" id="sendBtn" onclick="sendMessage()" disabled>전송</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/js/testbed.js"></script>
</body>
</html>
