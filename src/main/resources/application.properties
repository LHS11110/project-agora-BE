spring.application.name=frelog

# --- Redis Configuration ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- MS SQL Server Configuration ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=frelog_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Elasticsearch Configuration ---
spring.elasticsearch.uris=http://localhost:9200

# --- Log Pipeline Batch Scheduler Configuration ---
app.batch.queue.chunk-size=100
app.batch.scheduler.fixed-delay=5000

# --- Tiered Storage (Hot Redis / Cold MS SQL & ES) Configuration ---
# 최초 데이터 삽입 시 부여할 초기 점수 (기본 5.0)
app.tiered-storage.initial-score=5.0
# 덜 사용된(Cold) 데이터 판별 기준 점수 (이 점수 이하인 데이터를 콜드로 간주하여 영구 저장소 오프로드)
app.tiered-storage.cold-threshold-score=2.0
# 주기마다 적용할 점수 감쇠율 (0.9 = 10% 감쇠, 조회가 없는 데이터의 점수가 지속 하락)
app.tiered-storage.decay-factor=0.9
# 한 번에 오프로드할 최대 건수
app.tiered-storage.batch-limit=50
# 콜드 데이터 오프로딩 스케줄러 실행 간격 (밀리초, 기본 10초)
app.tiered-storage.scheduler.fixed-delay=10000
