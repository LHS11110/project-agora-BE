name: agora-backend

services:
  spring:
    image: agora-spring:local
    build:
      context: .
      dockerfile: docker/spring.Dockerfile
    container_name: agora-spring
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001
    volumes:
      - type: volume
        source: spring-resources
        target: /home/agora/project-agora/canvas-resource
      - type: bind
        source: ${ES_CA_CERT:?Set ES_CA_CERT to the host path of the Elasticsearch CA certificate}
        target: /run/certs/elasticsearch-ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REDIS_TLS_CA_CERT:?Set REDIS_TLS_CA_CERT to the host path of the Redis CA certificate}
        target: /run/certs/redis-ca.crt
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DB_NAME: ${DB_NAME:-agora_db}
      DB_USER: ${DB_USER:-agora_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-false}
      DB_MULTI_SUBNET_FAILOVER: ${DB_MULTI_SUBNET_FAILOVER:-true}
      DB_HOST: ${DOCKER_DB_HOST:-agora-mssql}
      DB_PORT: ${DOCKER_DB_PORT:-1433}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ES_HOST: ${DOCKER_ES_HOST:-agora-elasticsearch}
      ES_PORT: ${DOCKER_ES_PORT:-9200}
      ES_SCHEME: https
      ES_CA_CERT: /run/certs/elasticsearch-ca.crt
      ES_INDEX: ${ES_INDEX:-canvas}
      ES_USER_NAME: ${ES_USER_NAME:-agora_user}
      ES_USER_PASSWORD: ${ES_USER_PASSWORD:?Set ES_USER_PASSWORD in .env}
      ES_LOG_INDEX: ${ES_LOG_INDEX:-agora-logs}
      ES_LOG_USER_NAME: ${ES_LOG_USER_NAME:-agora_log_writer}
      ES_LOG_USER_PASSWORD: ${ES_LOG_USER_PASSWORD:-}
      ES_LOG_BATCH_SIZE: ${ES_LOG_BATCH_SIZE:-100}
      ES_LOG_FLUSH_INTERVAL_MS: ${ES_LOG_FLUSH_INTERVAL_MS:-1000}
      HA_FAILOVER_MONITOR_INTERVAL_MS: ${HA_FAILOVER_MONITOR_INTERVAL_MS:-10000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CPP_WS_PORT_OFFSET: ${CPP_WS_PORT_OFFSET:-2}
      CPP_INTERNAL_API_TOKEN: ${CPP_INTERNAL_API_TOKEN:?Set CPP_INTERNAL_API_TOKEN in .env}
      REDIS_USER: ${REDIS_USER:?Set REDIS_USER in .env}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD:?Set REDIS_USER_PASSWORD in .env}
      REDIS_SENTINELS: ${REDIS_SENTINELS:?Set the three Redis Sentinel addresses in .env}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-agora-master}
      REDIS_SENTINEL_USER: ${REDIS_SENTINEL_USER:-}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      REDIS_TLS_ENABLED: "true"
      REDIS_TLS_CA_CERT: /run/certs/redis-ca.crt
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - agora-net
      - redis-ha
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  cpp:
    image: agora-cpp:local
    build:
      context: .
      dockerfile: docker/cpp.Dockerfile
    container_name: agora-cpp
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: 0.0.0.0
      ADVERTISE_IP: ${CPP_DOCKER_ADVERTISE_IP:-agora-cpp}
      CPP_TRUSTED_PROXY_IPS: ${CPP_TRUSTED_PROXY_IPS:-172.21.0.250}
      PORT: "8000"
      WS_PORT: "8002"
      REST_THREAD_POOL: ${REST_THREAD_POOL:-16}
      CPP_CANVAS_LRU_CAPACITY: ${CPP_CANVAS_LRU_CAPACITY:-256}
      CPP_CANVAS_LRU_ITEMS_PER_CANVAS: ${CPP_CANVAS_LRU_ITEMS_PER_CANVAS:-64}
      CPP_INTERNAL_API_TOKEN: ${CPP_INTERNAL_API_TOKEN:?Set CPP_INTERNAL_API_TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DB_HOST: ${DOCKER_DB_HOST:-agora-mssql}
      DB_PORT: ${DOCKER_DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-agora_db}
      DB_USER: ${DB_USER:-agora_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-false}
      ES_HOST: ${DOCKER_ES_HOST:-agora-elasticsearch}
      ES_PORT: ${DOCKER_ES_PORT:-9200}
      ES_SCHEME: https
      ES_CA_CERT: /run/certs/elasticsearch-ca.crt
      ES_INDEX: ${ES_INDEX:-canvas}
      ES_USER_NAME: ${ES_USER_NAME:-agora_user}
      ES_USER_PASSWORD: ${ES_USER_PASSWORD:?Set ES_USER_PASSWORD in .env}
      ES_LOG_INDEX: ${ES_LOG_INDEX:-agora-logs}
      ES_LOG_USER_NAME: ${ES_LOG_USER_NAME:-agora_log_writer}
      ES_LOG_USER_PASSWORD: ${ES_LOG_USER_PASSWORD:-}
      ES_LOG_BATCH_SIZE: ${ES_LOG_BATCH_SIZE:-100}
      ES_LOG_FLUSH_INTERVAL_MS: ${ES_LOG_FLUSH_INTERVAL_MS:-1000}
      JAVA_HOST: agora-spring
      JAVA_PORT: "8080"
      REDIS_USER: ${REDIS_USER:?Set REDIS_USER in .env}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD:?Set REDIS_USER_PASSWORD in .env}
      REDIS_SENTINELS: ${REDIS_SENTINELS:?Set the three Redis Sentinel addresses in .env}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-agora-master}
      REDIS_SENTINEL_USER: ${REDIS_SENTINEL_USER:-}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      REDIS_TLS_ENABLED: "true"
      REDIS_TLS_CA_CERT: /run/certs/redis-ca.crt
      DB_FREETDS_CONF: ${DOCKER_DB_FREETDS_CONF:-${DB_FREETDS_CONF:-/etc/freetds/freetds.conf}}
    volumes:
      - type: bind
        source: ${ES_CA_CERT:?Set ES_CA_CERT to the host path of the Elasticsearch CA certificate}
        target: /run/certs/elasticsearch-ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REDIS_TLS_CA_CERT:?Set REDIS_TLS_CA_CERT to the host path of the Redis CA certificate}
        target: /run/certs/redis-ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CPP_FREETDS_CONF_HOST_PATH:-./cpp/config/freetds-${DB_TRUST_SERVER_CERTIFICATE:-false}.conf.example}
        target: /etc/freetds/freetds.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CPP_SQL_CA_CERT_HOST_PATH:-/etc/ssl/certs/ca-certificates.crt}
        target: /run/certs/sql-ca-bundle.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8002:8002"
    networks:
      - agora-net
      - redis-ha
    depends_on:
      spring:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  agora-net:
    external: true
    name: agora-net
  redis-ha:
    external: true
    name: agora-redis-ha

volumes:
  spring-resources:
    name: agora-backend-spring-resources
